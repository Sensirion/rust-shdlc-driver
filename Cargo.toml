[package]
name = "rust-shdlc-driver"
version = "0.2.0"
edition = "2021"
authors = ["Sensirion AG"]
description = "High-performance async Rust SHDLC driver and Python bindings with decoupled transport layer"
license = "BSD-3-Clause"
readme = "README.md"

[lib]
name = "rust_shdlc_driver"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.23", features = ["abi3-py311"], optional = true }
pyo3-async-runtimes = { version = "0.23", features = ["tokio-runtime"], optional = true }
tokio = { version = "1.43", features = ["full"] }
tokio-serial = { version = "5.4", optional = true }
async-trait = "0.1"
thiserror = "2.0"
byteorder = "1.5"
bytes = "1.9"
futures = "0.3"
tracing = "0.1"

[dev-dependencies]
tokio-test = "0.4"
tracing-subscriber = "0.3"

[features]
default = ["serial"]
extension-module = ["pyo3/extension-module"]
python = ["dep:pyo3", "dep:pyo3-async-runtimes"]
serial = ["dep:tokio-serial"]
